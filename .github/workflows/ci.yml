name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tokenguard
          POSTGRES_PASSWORD: tokenguard
          POSTGRES_DB: tokenguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tokenguard"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      ANTHROPIC_MODE: mock
      TEST_DATABASE_URL: postgresql+psycopg://tokenguard:tokenguard@localhost:5432/tokenguard_test
      EMBEDDING_CACHE_DIR: ${{ github.workspace }}/apps/api/.models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: apps/api/.models
          key: fastembed-all-MiniLM-L6-v2
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
