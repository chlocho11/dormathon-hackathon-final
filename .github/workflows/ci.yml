name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tokenguard
          POSTGRES_PASSWORD: tokenguard
          POSTGRES_DB: tokenguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tokenguard"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      ANTHROPIC_MODE: mock
      TEST_DATABASE_URL: postgresql+psycopg://tokenguard:tokenguard@localhost:5432/tokenguard_test
      EMBEDDING_CACHE_DIR: ${{ github.workspace }}/apps/api/.models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: apps/api/.models
          key: fastembed-all-MiniLM-L6-v2
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  dashboard:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tokenguard
          POSTGRES_PASSWORD: tokenguard
          POSTGRES_DB: tokenguard
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U tokenguard"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://tokenguard:tokenguard@localhost:5432/tokenguard
      ANTHROPIC_MODE: mock
      DEMO_MODE: "true"
      ALLOWED_ORIGINS: '["http://localhost:3100"]'
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      EMBEDDING_CACHE_DIR: ${{ github.workspace }}/apps/api/.models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: apps/api/.models
          key: fastembed-all-MiniLM-L6-v2
      - run: uv sync
        working-directory: apps/api
      - run: uv run alembic upgrade head
        working-directory: apps/api
      - run: uv run python ../../scripts/seed_demo.py --evaluate --predict
        working-directory: apps/api
      - name: Start mock API
        working-directory: apps/api
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/tokenguard-api.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8000/api/v1/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/tokenguard-api.log
          exit 1
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm audit --omit=dev
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm run test:dashboard
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-browser-results
          path: apps/web/test-results
